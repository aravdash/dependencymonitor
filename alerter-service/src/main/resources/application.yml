server:
  port: ${SERVER_PORT:8084}
spring:
  application:
    name: alerter-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # Must differ from dashboard-service so both applications receive every event.
      group-id: ${KAFKA_CONSUMER_GROUP:alerter-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 10
      properties:
        max.poll.interval.ms: 600000
    listener:
      ack-mode: record
alert:
  threshold: ${ALERT_SEVERITY_THRESHOLD:critical}
  webhook-url: ${ALERT_WEBHOOK_URL:}
  connect-timeout: ${ALERT_CONNECT_TIMEOUT:5s}
  read-timeout: ${ALERT_READ_TIMEOUT:10s}
management:
  endpoints:
    web:
      exposure:
        include: health,info
