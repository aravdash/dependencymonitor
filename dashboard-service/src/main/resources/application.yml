server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: dashboard-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dependency_health}
    username: ${DB_USERNAME:health}
    password: ${DB_PASSWORD:health}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 10000
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:dashboard-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 50
      properties:
        max.poll.interval.ms: 600000
    listener:
      ack-mode: record
  jackson:
    serialization:
      write-dates-as-timestamps: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
